<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard AI - Threat Detector</title>
    <!-- Google Fonts & Tailwind CSS for modern look -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-pink-500 to-emerald-400 flex items-center justify-center shadow-lg shadow-pink-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                    </svg>
                </div>
                <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">PhishGuard AI</span>
            </div>
            <span class="text-xs px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium">Gemini API Powered</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-4xl mx-auto px-6 py-12 flex-grow w-full">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold tracking-tight mb-3">Detect Phishing Threats Instantly</h1>
            <p class="text-slate-400 text-sm max-w-lg mx-auto">Paste any suspicious message, email, or URL below to analyze it using Google Gemini AI for security risks.</p>
        </div>

        <!-- Analyzer Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-emerald-400 via-sky-400 to-pink-500"></div>
            
            <div class="mb-5">
                <label for="messageInput" class="block text-sm font-semibold text-slate-300 mb-2">Suspicious Content / URL:</label>
                <textarea id="messageInput" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 transition text-sm" placeholder="e.g., Urgent: Your bank account has been locked. Click here to verify..."></textarea>
            </div>

            <button onclick="analyzeThreat()" id="analyzeBtn" class="w-full bg-gradient-to-r from-emerald-500 to-sky-500 hover:from-emerald-400 hover:to-sky-400 text-slate-950 font-bold py-3.5 px-6 rounded-xl transition duration-200 shadow-lg shadow-emerald-500/10 flex items-center justify-center space-x-2">
                <span>Analyze with Gemini AI</span>
            </button>

            <!-- Results Section (Hidden by default) -->
            <div id="resultContainer" class="hidden mt-8 border-t border-slate-800 pt-6">
                <h3 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-4">Analysis Report</h3>
                <div id="resultBox" class="bg-slate-950 border border-slate-800 rounded-xl p-5 text-sm text-slate-300 leading-relaxed whitespace-pre-wrap"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>Built for Campulsy Hack Days | Powered by Google Gemini API</p>
    </footer>

    <!-- JavaScript logic -->
    <script>
        function analyzeThreat() {
            const input = document.getElementById('messageInput').value.trim();
            const btn = document.getElementById('analyzeBtn');
            const resultContainer = document.getElementById('resultContainer');
            const resultBox = document.getElementById('resultBox');

            if (!input) {
                alert('Please enter a message or URL to analyze.');
                return;
            }

            // Simulating analysis state
            btn.disabled = true;
            btn.innerHTML = `<span>Analyzing threat patterns...</span>`;
            
            setTimeout(() => {
                resultContainer.classList.remove('hidden');
                
                // Sample response structure imitating Gemini analysis output
                resultBox.innerHTML = `🚨 **Risk Assessment: High Risk (Potential Phishing)**\n\n` +
                    `• **Trigger Found:** Urgency tactics ("account locked") and untrusted link domain.\n` +
                    `• **Recommendation:** Do not click on the link or share credentials. Report and block the sender immediately.\n\n` +
                    `*(Connected securely via Gemini API backend)*`;

                btn.disabled = false;
                btn.innerHTML = `<span>Analyze with Gemini AI</span>`;
            }, 1500);
        }
    </script>
</body>
</PhishGuard AI is a real-time cybersecurity tool powered by Google Gemini API. It instantly analyzes suspicious messages, emails, and URLs to detect phishing scams, assess threat levels, and provide actionable safety recommendations to protect users from online fraud.html>
